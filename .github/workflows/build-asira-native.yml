name: Build Asira Native Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-native/**'
      - 'src/hotfix.js'
      - 'src/quality-fixes.js'
      - 'src/index.js'
      - '.github/workflows/build-asira-native.yml'

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'
      - name: Validate patch and build
        shell: cmd
        run: |
          cd desktop-native
          call build.cmd
      - name: Upload new EXE
        uses: actions/upload-artifact@v4
        with:
          name: Asira-Native-Windows-20261122
          path: desktop-native/Asira-Native-7.1.exe
          if-no-files-found: error
          retention-days: 14
